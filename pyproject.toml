[project]
name = "pythonista-wkapp"
requires-python = ">= 3.10"
dependencies = [
  "bottle >= 0.13.4",
  # Mako < 1.2.2 is vulnerable to ReDoS (CVE-2022-40023).
  "Mako >= 1.2.2",
  # requests < 2.32.2 has CVE-2024-35195 (Session.verify bypass).
  "requests >= 2.32.2"
]
authors = [
    {name = "M4nw3l", email = "63550247+M4nw3l@users.noreply.github.com"},
]
readme = "README.md"
license = "MIT"
classifiers = [
		"Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: iOS",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: User Interfaces"
]
dynamic = ["version", "description"]

[project.urls]
Homepage = "https://github.com/m4nw3l/pythonista-wkapp"

[tool.flit.module]
name = "wkapp"

[tool.flit.sdist]
exclude = ["**/.*/"]

[build-system]
requires = ["flit_core >=3.11,<4"]
build-backend = "flit_core.buildapi"
